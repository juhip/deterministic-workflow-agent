name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q
      - run: python agent.py --scenario data/scenarios/scenario_05_competing_demand.sqlite

  rl_env:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rl_env
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run setup_data.py
      - run: uv run --frozen --extra dev just lint
      - run: uv run --frozen --extra test pytest -q
